      // survived a refresh/discard. So normal in-session navigation is unchanged from before (leave
      // an editor without saving → it's gone, no toast, no resurrection); only an actual reload
      // brings work back. A restored draft still saves against the version it opened at (the conflict
      // guard is untouched). Cleared on a successful save or an explicit discard.
      const PAGE_LOAD_ID = Date.now().toString(36) + Math.random().toString(36).slice(2);
      const DRAFT_PREFIX = "mkb.draft.";
      function draftStoreKey(id) { return DRAFT_PREFIX + (id || "__new__"); }
      function persistDraft(id, data) {
        try { sessionStorage.setItem(draftStoreKey(id), JSON.stringify({ ...data, _pl: PAGE_LOAD_ID })); } catch (_) {}
      }
      // Returns the draft data ONLY when it survived a reload (its page-load id differs from this
      // page's); otherwise null, so in-session reopens never auto-restore. Claims a returned draft
      // for this session so it isn't restored repeatedly.
      function readDraft(id) {
        try {
          const s = sessionStorage.getItem(draftStoreKey(id));
          if (!s) return null;
          const obj = JSON.parse(s);
          if (!obj || obj._pl === PAGE_LOAD_ID) return null; // same session → not a reload recovery
          sessionStorage.setItem(draftStoreKey(id), JSON.stringify({ ...obj, _pl: PAGE_LOAD_ID }));
          delete obj._pl;
          return obj;
        } catch (_) { return null; }
      }
      function dropDraft(id) {
        try { sessionStorage.removeItem(draftStoreKey(id)); } catch (_) {}
      }

      // The current view (read / blocks / edit) is **sticky**: navigating to another block
      // keeps the mode you're in. Mode only changes via the view tabs or creating a block.
      async function openBlock(id, _keepMode) {
        closeNavDrawer(); // on mobile, bring the opened block to the front (dismiss the nav drawer)
        active = id;
        currentView = "block";
        hideTip();
        renderNav();
        mainEl.scrollTop = 0;
        let view;
        try { view = await invoke("render_block", { id }); }
        catch (e) { mainEl.innerHTML = `<div class="pad"><p class="muted">${esc(e)}</p></div>`; return; }
        mainEl.innerHTML = topbar(view) + `<div class="pad" id="body"></div>`;
        mainEl.classList.toggle("locked", !!view.locked);
        mainEl.querySelectorAll(".seg button").forEach((b) =>
          (b.onclick = () => { mode = b.dataset.m; openBlock(id, true); }));
        mainEl.querySelector("#del").onclick = () => del(id);
        mainEl.querySelector("#lock").onclick = () => toggleLock(id, !!view.locked);
        // Metadata (tags + properties) live in #metawrap; cache the view so the collapse toggle can
        // re-render just that block without rebuilding the body.
        metaView = view;
        bindMeta(id);
        const body = mainEl.querySelector("#body");
        if (mode !== "blocks") { blocksSel = null; carveChip.hidden = true; }
        if (mode === "edit") await renderEdit(body, id, !!view.locked);
        else if (mode === "blocks") await renderBlocksView(body, id, view.html, !!view.locked, view.outline || [], view.content || "");
        else await renderReading(body, id, view.html);
      }

      // Toggle a block's human-only lock. Only the app can do this (it holds the app scope);
      // the daemon enforces it. On success, re-open the block so the UI reflects the new state.
      async function toggleLock(id, currentlyLocked) {
        try {
          await invoke("set_lock", { id, locked: !currentlyLocked });
          invalidate();
          await openBlock(id, true);
        } catch (e) { toast(String(e), "error"); }
      }

      // Set the block's managed tags to fmTags + `name` (deduped), then refresh.
      async function addTag(id, fmTags, name) {
        const t = String(name || "").trim().replace(/^#/, "");
        if (!t) return;
        const next = fmTags.slice();
        if (!next.some((x) => x.toLowerCase() === t.toLowerCase())) next.push(t);
        try { await invoke("set_tags", { id, tags: next }); invalidate(); await openBlock(id, true); }
        catch (e) { toast(String(e), "error"); }
      }
      // Remove `name` from the block's managed tags, then refresh.
      async function removeTag(id, fmTags, name) {
        const next = fmTags.filter((x) => x.toLowerCase() !== String(name).toLowerCase());
        try { await invoke("set_tags", { id, tags: next }); invalidate(); await openBlock(id, true); }
        catch (e) { toast(String(e), "error"); }
      }

      // Add/update a property key:value (other props preserved), then refresh. Empty key is a no-op.
      async function addProp(id, key, value) {
        const k = String(key || "").trim();
        if (!k) return;
        try { await invoke("set_props", { id, props: [[k, String(value || "").trim()]] }); invalidate(); await openBlock(id, true); }
        catch (e) { toast(String(e), "error"); }
      }
      // Remove a property key, then refresh.
      async function removeProp(id, key) {
        try { await invoke("unset_props", { id, keys: [String(key)] }); invalidate(); await openBlock(id, true); }
        catch (e) { toast(String(e), "error"); }
      }

      // ---------- READ: clean "as-intended" document (embeds dissolved inline) ----------
      async function renderReading(body, id, html) {
        // Flatten every embed card into seamless inline content: drop the "⧉ source" header
        // and unwrap the blockquote so the transcluded content flows as one document.
        const tmp = document.createElement("div");
        tmp.innerHTML = html;
        let card;
        while ((card = tmp.querySelector("blockquote.mkb-embed"))) {
          const header = card.querySelector(":scope > p:first-child");
          if (header) header.remove();
          while (card.firstChild) card.parentNode.insertBefore(card.firstChild, card);
          card.remove();
        }
        resolveAssetImages(tmp);
        body.innerHTML = `<div class="content reading">${tmp.innerHTML}</div>`;
        mermaidIn(body);
        highlightIn(body);
        attachChipHovers(body);
        // References stay navigable (the global mkb: handler covers them); no edit affordances.
      }

      // Map `mkb-asset:<abs path>` image sources (emitted by the shared renderer for
      // vault-relative images, e.g. ![](assets/x.png)) onto the Tauri asset protocol so the
      // WebView can load files from the local vault. External URLs are left untouched by the
      // renderer, so they never reach here.
      function resolveAssetImages(root) {
        root.querySelectorAll('img[src^="mkb-asset:"]').forEach((img) => {
          const abs = img.getAttribute("src").slice("mkb-asset:".length);
          try { img.src = convertFileSrc(abs); }
          catch { img.removeAttribute("src"); }
        });
      }

      // ---------- BLOCKS: interactive view (highlight→carve · hover +insert · dbl-click edit) ----------
      // A small, FIXED "Carve" button anchored bottom-right that appears whenever text is highlighted
      // inside the live Blocks content. It stays put (no dizzying follow-the-selection movement) and
      // carves EXACTLY the highlighted text into a new block. A platform hotkey triggers it too.
      const isMac = /Mac|iP(hone|ad|od)/.test(navigator.platform || navigator.userAgent);
      const carveHotkeyLabel = isMac ? "⌘⇧X" : "Ctrl+Shift+X";
      let blocksSel = null; // { content, outline, rawBody, id } for the live Blocks view, or null
      const carveChip = (() => {
        const el = document.createElement("button");
        el.className = "carvechip"; el.hidden = true;
        el.innerHTML = `⑂ Carve <span class="kbd">${carveHotkeyLabel}</span>`;
        el.onmousedown = (e) => e.preventDefault(); // keep the text selection alive through the click
        document.body.appendChild(el);
        return el;
      })();

      // Map the current text highlight to a [startByte, endByte] range in the raw body — the exact
      // source the user highlighted — or null. Selection endpoints are located inside their own
      // top-level block's raw source (via the data-bi ↔ outline map), so duplicate text elsewhere
      // doesn't confuse it; byte offsets are computed with TextEncoder so non-ASCII is correct. If a
      // side can't be isolated (inline markup makes the rendered text not a literal source
      // substring), that side falls back to the block boundary.
      function highlightSourceRange() {
        if (!blocksSel || !document.body.contains(blocksSel.content)) return null;
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
        const rng = sel.getRangeAt(0);
        const { content, outline, rawBody } = blocksSel;
        if (!content.contains(rng.commonAncestorContainer)) return null;
        const blockOf = (node) => {
          const el = node.nodeType === 1 ? node : node.parentElement;
          return el && content.contains(el) ? el.closest("[data-bi]") : null;
        };
        const sBlk = blockOf(rng.startContainer), eBlk = blockOf(rng.endContainer);
        if (!sBlk || !eBlk) return null;
        const sbi = +sBlk.dataset.bi, ebi = +eBlk.dataset.bi;
        if (!outline[sbi] || !outline[ebi]) return null;
        const enc = new TextEncoder();
        const bytes = enc.encode(rawBody);
        const blockSrc = (bi) => new TextDecoder().decode(bytes.slice(outline[bi][0], outline[bi][1]));
        const byteLen = (s) => enc.encode(s).length;
        // Text the highlight covers within the start block (to its end if the selection continues).
        const headRange = document.createRange();
        headRange.setStart(rng.startContainer, rng.startOffset);
        if (sbi === ebi) headRange.setEnd(rng.endContainer, rng.endOffset);
        else headRange.setEndAfter(sBlk);
        const headText = headRange.toString();
        const srcS = blockSrc(sbi);
        const hi = srcS.indexOf(headText);
        const startByte = hi >= 0 ? outline[sbi][0] + byteLen(srcS.slice(0, hi)) : outline[sbi][0];
        let endByte;
        if (sbi === ebi) {
          endByte = hi >= 0 ? startByte + byteLen(headText) : outline[ebi][1];
        } else {
          // Text the highlight covers within the end block (from its start to the selection end).
          const tailRange = document.createRange();
          tailRange.setStartBefore(eBlk);
          tailRange.setEnd(rng.endContainer, rng.endOffset);
          const tailText = tailRange.toString();
          const srcE = blockSrc(ebi);
          const ti = srcE.indexOf(tailText);
          endByte = ti >= 0 ? outline[ebi][0] + byteLen(srcE.slice(0, ti + tailText.length)) : outline[ebi][1];
        }
        return startByte < endByte ? [startByte, endByte] : null;
      }

      // Show/hide the fixed carve button based on whether a valid highlight exists. It doesn't move
      // with the selection — it lives in a fixed spot — so it never feels dizzying.
      function updateCarveChip() {
        carveChip.hidden = !highlightSourceRange();
      }
      async function carveHighlight() {
        const r = highlightSourceRange();
        if (!r || !blocksSel) return;
        const { id } = blocksSel;
        try {
          window.getSelection().removeAllRanges();
          carveChip.hidden = true;
          await invoke("carve_selection", { parentId: id, start: r[0], end: r[1] });
          invalidate(); await loadBlocks(id); openBlock(id, true);
        } catch (e) { toast(String(e), "error"); }
      }
      carveChip.onclick = carveHighlight;
      document.addEventListener("selectionchange", () => { if (blocksSel) updateCarveChip(); });
      // Platform hotkey: ⌘⇧X on macOS, Ctrl+Shift+X elsewhere. Only acts when a Blocks-view highlight
      // is present, so it never shadows a system/editor shortcut in other contexts.
      document.addEventListener("keydown", (e) => {
        const mod = isMac ? e.metaKey : e.ctrlKey;
        if (mod && e.shiftKey && (e.key === "x" || e.key === "X")) {
          if (blocksSel && highlightSourceRange()) { e.preventDefault(); carveHighlight(); }
        }
      });

      async function renderBlocksView(body, id, html, locked, outline, rawBody) {
        body.innerHTML =
          (locked ? `<div class="lockednote"><span class="lk">🔒</span><span>Locked (human-only) — unlock in the header to edit this block. Embedded blocks follow their own lock state.</span></div>` : "") +
          `<div class="content" id="content">${html}</div>` +
          (locked ? "" : `<div class="bhint">Highlight text to carve it (${carveHotkeyLabel}) · double-click a block to edit · hover between blocks to insert</div>`);
        resolveAssetImages(body);
        mermaidIn(body);
        highlightIn(body);
        attachChipHovers(body);
        const content = body.querySelector("#content");
        blocksSel = locked ? null : { content, outline, rawBody, id };
        carveChip.hidden = true;

        // The child id embedded by a card element (its `mkb:` link target), or null.
        const cardChildId = (card) => {
          const a = card.querySelector('a[href^="mkb:"]');
          return a ? a.getAttribute("href").slice("mkb:".length).split("#")[0] : null;
        };

        // Hover-to-insert: a zero-height zone in every gap between top-level blocks (and at top/
        // bottom). It adds NO layout space — its hit area is absolutely positioned, straddling the
        // block's natural margin — so the page displays exactly as it would without it. Hovering
        // reveals a thin line + centered "+"; clicking opens an inline editor there, and on save the
        // new block is embedded at that gap's source offset. The primary way to add a block.
        if (!locked) {
          const blocks = [...content.querySelectorAll("[data-bi]")];
          const openAt = (z, commit) => draftBlockEditor(
            (wrap) => { z.classList.add("open"); z.replaceWith(wrap); },
            commit,
            () => openBlock(id, true),
          );
          const gap = (offset, refEl, placeAfter) => {
            const z = document.createElement("div");
            z.className = "insertzone";
            z.innerHTML = `<div class="hit" title="Add block here"></div><div class="iline"></div><div class="iplus"></div>`;
            z.querySelector(".hit").onclick = () => openAt(z,
              (child) => invoke("link_block_at_offset", { sourceId: id, targetId: child, embed: true, offset }));
            if (placeAfter) refEl.after(z); else refEl.before(z);
          };
          if (blocks.length && outline[0]) gap(outline[0][0], blocks[0], false); // top
          blocks.forEach((b) => {
            const bi = +b.dataset.bi;
            if (outline[bi]) gap(outline[bi][1], b, true); // after each block
          });
          if (!blocks.length) {
            // Empty parent: a single insert affordance that appends.
            const z = document.createElement("div");
            z.className = "insertzone empty";
            z.innerHTML = `<div class="hit" title="Add block here"></div><div class="iline"></div><div class="iplus"></div>`;
            z.querySelector(".hit").onclick = () => openAt(z,
              (child) => invoke("link_blocks", { sourceId: id, targetId: child, embed: true }));
            content.after(z);
          }
        }

        // Double click edits: a card edits its child; parent prose edits the parent block. (Single
        // click does nothing special, so native text highlighting is unobstructed.)
        content.ondblclick = (e) => {
          if (e.target.closest('a[href^="mkb:"]')) return;
          if (locked) return;
          const card = e.target.closest("blockquote.mkb-embed");
          if (card) { const cid = cardChildId(card); if (cid) inlineEdit(card, cid, () => openBlock(id, true)); }
          else inlineEdit(content, id, () => openBlock(id, true));
        };

        // Right-click: a convenience menu (secondary — every action here also has a visible
        // affordance). Carve appears when text is highlighted; card actions when over an embed.
        content.oncontextmenu = (e) => {
          if (e.target.closest('a[href^="mkb:"]')) return; // let link context stand
          const card = e.target.closest("blockquote.mkb-embed");
          const items = [];
          if (!locked && highlightSourceRange()) {
            items.push({ label: "⑂ Carve highlight to a block", run: carveHighlight });
          }
          if (card) {
            const childId = cardChildId(card);
            if (childId) {
              if (items.length) items.push({ sep: true });
              if (!locked) items.push({ label: "Edit", run: () => inlineEdit(card, childId, () => openBlock(id, true)) });
              items.push({ label: "Open", run: () => openBlock(childId) });
              items.push({ label: "Copy ![[embed]]", run: () => copyText(`![[${childId}]]`, "Copied embed") });
              if (!locked) {
                items.push(
                  { sep: true },
                  { label: "Remove from page", run: () => removeFromPage(id, childId) },
                  { label: "Delete block", danger: true, run: () => deleteChildFromPage(id, childId) },
                );
              }
            }
          } else if (!locked) {
            if (items.length) items.push({ sep: true });
            items.push({ label: "Edit block", run: () => inlineEdit(content, id, () => openBlock(id, true)) });
          }
          if (items.length) { e.preventDefault(); showContextMenu(e.clientX, e.clientY, items); }
        };
        await renderRefs(body, id);
      }

      // Replace `regionEl` with an inline editor for block `blockId`.
      async function inlineEdit(regionEl, blockId, done) {
        if (regionEl.dataset.editing) return;
        // A locked (human-only) block isn't editable here — give a clear cue rather than opening
        // an editor whose save would be refused by the daemon. Lock is per-block, so a locked
        // embed card is caught here even when the parent is unlocked.
        try {
          if (await invoke("block_locked", { id: blockId })) {
            toast("🔒 This block is locked — open it and unlock (🔓) to edit.");
            return;
          }
        } catch { /* fall through: if the check fails, let the edit attempt surface the error */ }
        regionEl.dataset.editing = "1";
        let src = "";
        let baseVersion = null;
        try { src = await invoke("block_source", { id: blockId }); } catch (e) { toast(String(e), "error"); return; }
        try { baseVersion = await invoke("block_version", { id: blockId }); } catch { /* unguarded if unavailable */ }
        const wrap = document.createElement("div");
        const ta = document.createElement("textarea");
        ta.className = "editarea"; ta.value = src; ta.spellcheck = false;
        // Restore an unsaved draft (e.g. after a mobile tab reload) if it differs from the loaded body.
        const _d = readDraft(blockId);
        if (_d && typeof _d.body === "string" && _d.body !== src) { ta.value = _d.body; toast("Restored an unsaved draft."); }
        ta.addEventListener("input", () => persistDraft(blockId, { body: ta.value }));
        wrap.appendChild(ta);
        const bar = document.createElement("div");
        bar.className = "editbar";
        bar.innerHTML = `<button class="primary" data-a="save">Save</button><button data-a="cancel">Cancel</button>`+
          `<span class="muted">⌘↵ save · Esc cancel · type <code>[[</code> to link</span>`;
        wrap.appendChild(bar);
        regionEl.replaceWith(wrap);
        autosize(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
        attachPicker(ta);
        let finished = false;
        const save = async () => {
          if (finished) return;
          if (ta.value !== src) {
            let res;
            try { res = await invoke("save_block", { id: blockId, title: null, body: ta.value, baseVersion }); }
            catch (e) { toast(String(e), "error"); return; }
            if (res.status === "conflict") {
              const r = await resolveConflict({ base: src, mine: ta.value, theirs: res.current_body });
              if (r.action === "cancel") return; // keep the inline editor open
              if (r.action === "current") { ta.value = res.current_body; src = res.current_body; baseVersion = res.version; autosize(ta); return; }
              if (r.action === "merge") {
                // Confirmed conflict-free in the preview; persist against the vault's current version.
                try {
                  const r2 = await invoke("save_block", { id: blockId, title: null, body: r.text, baseVersion: res.version });
                  if (r2.status !== "applied") {
                    ta.value = r.text; src = r2.current_body; baseVersion = r2.version; autosize(ta);
                    toast("The block changed again while merging — review and Save once more.");
                    return;
                  }
                } catch (e) { toast(String(e), "error"); return; }
                invalidate(); finished = true; dropDraft(blockId); done(); return;
              }
              // r.action === "mine": overwrite the vault with the local draft.
              try {
                const r2 = await invoke("save_block", { id: blockId, title: null, body: ta.value, baseVersion: null });
                if (r2.status !== "applied") { toast("Save failed", "error"); return; }
              } catch (e) { toast(String(e), "error"); return; }
            }
            invalidate();
          }
          finished = true;
          dropDraft(blockId);
          done();
        };
        const cancel = () => { if (finished) return; finished = true; dropDraft(blockId); done(); };
        bar.querySelector('[data-a="save"]').onclick = save;
        bar.querySelector('[data-a="cancel"]').onclick = cancel;
        ta.addEventListener("input", () => autosize(ta));
        ta.addEventListener("keydown", (e) => {
          if (pickerOpen()) return;
          if (e.key === "Escape") { e.preventDefault(); cancel(); }
          else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
        });
      }

      // ---------- EDIT tab: title + raw body + carve-by-selection ----------
      async function renderEdit(body, id, locked) {
        if (locked) {
          body.innerHTML = `<div class="lockednote"><span class="lk">🔒</span>
            <span>This block is <strong>locked</strong> (human-only). Unlock it (🔓 in the header) to edit — AI clients can read it but not modify it.</span></div>`;
          return;
        }
        const [src, title, ver] = await Promise.all([
          invoke("block_source", { id }),
          invoke("block_title_of", { id }),
          invoke("block_version", { id }),
        ]);
        // Optimistic-concurrency state: the version the editor opened against, and the body it
        // loaded. `baseVersion` is sent on save so a concurrent change is caught instead of
        // clobbered; `baseBody` is retained for a future 3-way merge view.
        let baseVersion = ver;
        let baseBody = src;
        body.innerHTML = `<input class="titleedit" id="t" placeholder="Title (optional)" />
          <textarea class="editarea" id="b" spellcheck="false" style="min-height:50vh"></textarea>
          <div class="editbar">
            <button class="primary" id="save">Save</button>
            <button id="carve" title="Extract the selected text into its own reusable block">⑂ Carve selection</button>
            <button id="attach" title="Add an image to the vault and insert it here">🖼 Add image</button>
            <input type="file" id="imgfile" accept="image/*" multiple hidden />
            <span class="muted" id="msg">Type <code>[[</code> to link/embed · drag, paste, or add an image.</span>
          </div>
          <div class="reflegend" id="reflegend"></div>`;
        body.querySelector("#t").value = title || "";
        const ta = body.querySelector("#b");
        ta.value = src; attachPicker(ta);
        // Restore an unsaved draft (e.g. after a mobile tab reload) if it differs from what loaded.
        const titleInput = body.querySelector("#t");
        const _draft = readDraft(id);
        if (_draft && (_draft.body !== src || (_draft.title || "") !== (title || ""))) {
          if (typeof _draft.body === "string") ta.value = _draft.body;
          if (typeof _draft.title === "string") titleInput.value = _draft.title;
          toast("Restored an unsaved draft.");
        }
        const persistNow = () => persistDraft(id, { title: titleInput.value, body: ta.value });
        ta.addEventListener("input", persistNow);
        titleInput.addEventListener("input", persistNow);
        const legend = body.querySelector("#reflegend");
        // Ensure the block index is loaded so the legend resolves ULID targets to titles instead
        // of showing raw ids (the index is otherwise loaded lazily by the [[ picker).
        await getIndex();
        renderLegend(legend, ta.value);
        ta.addEventListener("input", () => renderLegend(legend, ta.value));
        // Save through the optimistic-concurrency guard. Returns true if the block is now persisted
        // with the editor's content (so callers may refresh), false if the save didn't land (a
        // conflict the user chose to reconcile, or an error). Shared by Save and Carve.
        async function saveEditor() {
          const newTitle = body.querySelector("#t").value.trim() || null;
          const newBody = ta.value;
          let res;
          try {
            res = await invoke("save_block", { id, title: newTitle, body: newBody, baseVersion });
          } catch (e) { body.querySelector("#msg").textContent = String(e); return false; }
          if (res.status === "applied") { baseVersion = res.version; baseBody = newBody; return true; }
          // Conflict: the block changed under us. Resolve via the side-by-side.
          const r = await resolveConflict({ base: baseBody, mine: newBody, theirs: res.current_body });
          if (r.action === "mine") {
            try {
              const r2 = await invoke("save_block", { id, title: newTitle, body: newBody, baseVersion: null });
              if (r2.status === "applied") { baseVersion = r2.version; baseBody = newBody; return true; }
            } catch (e) { body.querySelector("#msg").textContent = String(e); }
            return false;
          }
          if (r.action === "current") {
            ta.value = res.current_body;
            body.querySelector("#t").value = res.current_title || "";
            baseVersion = res.version; baseBody = res.current_body;
            renderLegend(legend, ta.value);
            body.querySelector("#msg").textContent = "Reloaded the latest version — your unsaved changes were discarded.";
          } else if (r.action === "merge") {
            // The merge was confirmed conflict-free in the preview; persist it against the vault's
            // current version (so the guard re-fires only if the block changed yet again).
            try {
              const r2 = await invoke("save_block", { id, title: newTitle, body: r.text, baseVersion: res.version });
              if (r2.status === "applied") {
                ta.value = r.text; baseVersion = r2.version; baseBody = r.text;
                renderLegend(legend, ta.value);
                return true;
              }
              // Raced again: keep the merged text, adopt the newest token, prompt another Save.
              ta.value = r.text; baseVersion = r2.version; baseBody = r2.current_body;
              renderLegend(legend, ta.value);
              body.querySelector("#msg").textContent = "The block changed again while merging — review and Save once more.";
            } catch (e) { body.querySelector("#msg").textContent = String(e); }
            return false;
          }
          return false; // cancel / current: nothing newly saved
        }
        body.querySelector("#save").onclick = async () => {
          if (await saveEditor()) { dropDraft(id); invalidate(); await loadBlocks(id); openBlock(id); }
        };
        body.querySelector("#carve").onclick = async () => {
          const start = ta.selectionStart, end = ta.selectionEnd;
          if (start === end) { body.querySelector("#msg").textContent = "Select some text to carve."; return; }
          try {
            // Persist current body first so offsets match the stored block, then carve.
            if (!(await saveEditor())) return;
            await invoke("carve_selection", { parentId: id, start, end });
            dropDraft(id); invalidate(); await loadBlocks(id); openBlock(id);
          } catch (e) { body.querySelector("#msg").textContent = String(e); }
        };
        // Image import: button, drag-and-drop, and paste all funnel through the shared wiring.
        wireImageImport(ta, body.querySelector("#msg"), body.querySelector("#imgfile"), body.querySelector("#attach"));
      }

      // Wire image import onto a textarea: the optional Add-image button + hidden file input, plus
      // drag-and-drop and paste. Each path calls importImages, which writes files into the vault
      // (assets/) via the daemon and inserts a Markdown image at the caret. Shared by the block
      // editor and the new-block draft so both behave identically (one place to fix).
      function wireImageImport(ta, msg, fileInput, attachBtn) {
        if (attachBtn && fileInput) {
          attachBtn.onclick = () => fileInput.click();
          fileInput.onchange = () => { importImages(ta, fileInput.files, msg); fileInput.value = ""; };
        }
        ta.addEventListener("dragover", (e) => { e.preventDefault(); ta.classList.add("dropping"); });
        ta.addEventListener("dragleave", () => ta.classList.remove("dropping"));
        ta.addEventListener("drop", (e) => {
          e.preventDefault(); ta.classList.remove("dropping");
          if (e.dataTransfer && e.dataTransfer.files.length) importImages(ta, e.dataTransfer.files, msg);
        });
        ta.addEventListener("paste", (e) => {
          const files = [...(e.clipboardData?.items || [])]
            .filter((it) => it.kind === "file" && it.type.startsWith("image/"))
            .map((it) => it.getAsFile())
            .filter(Boolean);
          if (files.length) { e.preventDefault(); importImages(ta, files, msg); }
        });
      }

      // Map an image MIME type to a file extension for paste/screenshot files that arrive unnamed.
      const IMG_EXT = { "image/png":"png","image/jpeg":"jpg","image/gif":"gif","image/webp":"webp","image/svg+xml":"svg","image/bmp":"bmp","image/avif":"avif" };

      // Import one or more image files into the vault and insert ![](assets/…) at the caret. Each
      // file's bytes go to the daemon (which writes assets/ and returns the vault-relative path);
      // non-image files are skipped. Errors are surfaced in the editor status line.
      async function importImages(ta, fileList, msg) {
        const files = [...fileList].filter((f) => !f.type || f.type.startsWith("image/"));
        if (!files.length) { if (msg) msg.textContent = "Only image files can be added."; return; }
        for (const file of files) {
          try {
            if (msg) msg.textContent = `Adding ${file.name || "image"}…`;
            const bytes = Array.from(new Uint8Array(await file.arrayBuffer()));
            const name = file.name || `pasted-${Date.now()}.${IMG_EXT[file.type] || "png"}`;
            const rel = await invoke("add_asset", { name, data: bytes });
            const alt = (file.name || "image").replace(/\.[^.]+$/, "");
            insertAtCursor(ta, `![${alt}](${rel})\n`);
            if (msg) msg.textContent = `Added ${rel}`;
          } catch (e) {
            if (msg) msg.textContent = `Could not add image: ${e}`;
          }
        }
      }

      // Insert text at the textarea's caret (replacing any selection) and keep the caret after it,
      // firing an input event so the reference legend refreshes.
      function insertAtCursor(ta, text) {
        const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? ta.value.length;
        ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
        const pos = s + text.length;
        ta.selectionStart = ta.selectionEnd = pos;
        ta.focus();
        ta.dispatchEvent(new Event("input"));
      }

      async function renderRefs(body, id) {
        let back;
        try { back = await invoke("backlinks", { id }); } catch { return; }
        if (!back.length) return;
        const refs = document.createElement("div");
        refs.className = "refs";
        refs.innerHTML = `<h3>Linked references (${back.length})</h3><ul>${
          back.map((b) => `<li><a data-go="${esc(b.id)}">${esc(b.title || b.id)}</a></li>`).join("")
        }</ul>`;
        body.appendChild(refs);
        refs.querySelectorAll("a[data-go]").forEach((a) => (a.onclick = () => openBlock(a.dataset.go)));
      }

      // ---------- link picker ('[[' autocomplete) ----------
      let picker = null;       // {el, ta, anchorPos, query, embed, items, sel}
      function pickerOpen() { return !!picker; }

      function attachPicker(ta) {
        ta.addEventListener("keydown", (e) => {
          if (!picker || picker.ta !== ta) return;
          if (e.key === "ArrowDown") { e.preventDefault(); movePicker(1); }
          else if (e.key === "ArrowUp") { e.preventDefault(); movePicker(-1); }
          else if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); choosePicker(e.key === "Tab"); }
          else if (e.key === "Escape") { e.preventDefault(); closePicker(); }
        });
        ta.addEventListener("input", () => maybePicker(ta));
        ta.addEventListener("blur", () => setTimeout(closePicker, 120));
      }

      async function maybePicker(ta) {
        const upto = ta.value.slice(0, ta.selectionStart);
        // Match an open '[[' or '![[' with no closing ']]' yet, capturing the typed query.
        const m = upto.match(/(!?)\[\[([^\]\n]*)$/);
        if (!m) { closePicker(); return; }
        const embed = m[1] === "!";
        const query = m[2];
        const anchorPos = ta.selectionStart - query.length - (embed ? 3 : 2);
        const idx = await getIndex();
        const ql = query.toLowerCase();
        const items = idx
          .filter((b) => !ql || (b.title || "").toLowerCase().includes(ql) || b.id.toLowerCase().includes(ql))
          .slice(0, 50);
        if (!picker) {
          const el = document.createElement("div");
          el.className = "picker";
          document.body.appendChild(el);
          picker = { el, ta, anchorPos, query, embed, items, sel: 0 };
        } else {
          Object.assign(picker, { ta, anchorPos, query, embed, items, sel: 0 });
        }
        drawPicker();
      }

      function drawPicker() {
        const { el, ta, items, sel, embed } = picker;
        const coords = caretXY(ta);
        el.style.left = coords.x + "px";
        el.style.top = coords.y + "px";
        const kind = embed ? "embed ![[…]]" : "link [[…]]";
        el.innerHTML = `<div class="hd">${kind} — ↑↓ select · Enter insert · Tab ${embed?"link":"embed"}</div>` +
          (items.length ? items.map((b, i) =>
            `<div class="opt ${i===sel?"sel":""}" data-i="${i}">${esc(b.title || "(untitled)")} <small>${b.id.slice(0,8)}</small></div>`
          ).join("") : `<div class="opt muted">No match — Enter to create “${esc(picker.query)}”</div>`) +
          `<div class="mk">Enter inserts the block's stable id; an empty match creates a new block. Tip: a <code>[[title]]</code> you type by hand resolves too.</div>`;
        el.querySelectorAll(".opt[data-i]").forEach((o) =>
          (o.onmousedown = (ev) => { ev.preventDefault(); picker.sel = +o.dataset.i; choosePicker(false); }));
      }

      function movePicker(d) {
        if (!picker || !picker.items.length) return;
        picker.sel = (picker.sel + d + picker.items.length) % picker.items.length;
        drawPicker();
      }

      async function choosePicker(toggleKind) {
        if (!picker) return;
        const { ta, anchorPos, query, items, sel } = picker;
        const embed = toggleKind ? !picker.embed : picker.embed;
        let targetId;
        if (items.length) targetId = items[sel].id;
        else {
          // No match: create a new block titled with the typed query.
          const title = query.trim();
          if (!title) { closePicker(); return; }
          try { targetId = await invoke("create_block", { title, body: `# ${title}\n\n` }); invalidate(); }
          catch (e) { toast(String(e), "error"); closePicker(); return; }
        }
        const directive = (embed ? "![[" : "[[") + targetId + "]]";
        const after = ta.value.slice(ta.selectionStart);
        ta.value = ta.value.slice(0, anchorPos) + directive + after;
        const caret = anchorPos + directive.length;
        closePicker();
        ta.focus(); ta.setSelectionRange(caret, caret);
        autosize(ta);
      }

      function closePicker() { if (picker) { picker.el.remove(); picker = null; } }

      // Approximate caret screen position using a mirror div.
      function caretXY(ta) {
        const div = document.createElement("div");
        const st = getComputedStyle(ta);
        for (const p of ["fontFamily","fontSize","fontWeight","lineHeight","padding","border","whiteSpace","wordWrap","width"]) div.style[p] = st[p];
        div.style.position = "absolute"; div.style.visibility = "hidden"; div.style.whiteSpace = "pre-wrap"; div.style.wordWrap = "break-word";
        const before = ta.value.slice(0, ta.selectionStart);
        div.textContent = before;
        const span = document.createElement("span"); span.textContent = "\u200b"; div.appendChild(span);
        document.body.appendChild(div);
        const r = ta.getBoundingClientRect();
        const x = r.left + (span.offsetLeft % r.width);
        const y = r.top + span.offsetTop - ta.scrollTop + 20;
        div.remove();
        return { x: Math.min(x, window.innerWidth - 360), y: Math.min(y, window.innerHeight - 280) };
      }

      function autosize(ta) { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight + 2, 60) + "px"; }

      // Syntax-highlight every fenced code block under `root` (offline highlight.js). Markdown
      // emits `<pre><code class="language-xxx">`; the common bundle plus vendored grammars cover
      // C#/Python/Rust/Go/shell/SQL/YAML/Docker/PowerShell/nginx/Kusto(KQL)/etc. Unknown
      // languages degrade to plain text.
      // Apply syntax highlighting to every code block under `root`. highlight.js is a vendored
      // classic <script>; in the desktop app's webview that local script very occasionally hasn't
      // evaluated yet when the first block renders (a custom-protocol load race), and without it the
      // code blocks stay unstyled for the whole session — the symptom that a restart "fixed". Guard
      // against that: if hljs isn't ready, poll briefly and re-highlight whatever is currently shown
      // once it loads, so it self-heals instead of needing a restart.
      let hljsRetry = null;
      function highlightIn(root) {
        if (!window.hljs) {
          if (!hljsRetry) {
            let tries = 0;
            hljsRetry = setInterval(() => {
              if (window.hljs) {
                clearInterval(hljsRetry); hljsRetry = null;
                // The head's alias registration may have run before hljs loaded; redo it now.
                try { window.hljs.registerAliases(["kusto", "azuremonitor", "loganalytics"], { languageName: "kql" }); } catch {}
                highlightIn(mainEl); // re-highlight the open block now that the highlighter is up
              } else if (++tries > 50) { clearInterval(hljsRetry); hljsRetry = null; }
            }, 100);
          }
          return;
        }
        root.querySelectorAll("pre code").forEach((el) => {
          // Mermaid blocks are rendered as diagrams (mermaidIn), not syntax-highlighted.
          if (el.classList.contains("language-mermaid")) return;
          if (el.dataset.highlighted) return; // already highlighted (idempotent re-runs)
          try { window.hljs.highlightElement(el); } catch {}
        });
      }

      // Render ` ```mermaid ` fenced blocks as diagrams (offline, vendored mermaid). Each becomes a
      // figure holding the rendered SVG plus a small toggle to flip to the raw source and back —
      // so the diagram is the default view but the text is always one click away. A parse/render
      // failure degrades gracefully to the source with an error note (never a blank). Runs before
      // highlightIn so those blocks are claimed before the syntax highlighter touches them.
      let mermaidSeq = 0;
      function mermaidIn(root) {
        if (!window.mermaid) return;
        // Pick the mermaid theme to match the app theme (re-initialised per pass so a theme toggle
        // re-renders diagrams in the right palette).
        try { window.mermaid.initialize({ startOnLoad: false, theme: effectiveDark() ? "dark" : "default", securityLevel: "strict" }); } catch {}
        root.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
          const pre = code.parentElement;
          const src = code.textContent;
          const fig = document.createElement("figure");
          fig.className = "mermaid-fig";
          const view = document.createElement("div");
          view.className = "mermaid-view";
          const srcPre = document.createElement("pre");
          srcPre.className = "mermaid-src";
          srcPre.style.display = "none";
          const srcCode = document.createElement("code");
          srcCode.textContent = src;
          srcPre.appendChild(srcCode);
          const bar = document.createElement("div");
          bar.className = "mermaid-bar";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = "</> Source";
          btn.title = "Toggle between the rendered diagram and its source";
          let showingSrc = false;
          btn.onclick = () => {
            showingSrc = !showingSrc;
            view.style.display = showingSrc ? "none" : "";
            srcPre.style.display = showingSrc ? "" : "none";
            btn.textContent = showingSrc ? "▦ Diagram" : "</> Source";
          };
          bar.appendChild(btn);
          fig.appendChild(bar);
          fig.appendChild(view);
          fig.appendChild(srcPre);
          pre.replaceWith(fig);
          const id = "mmd-" + (++mermaidSeq) + "-" + Date.now().toString(36);
          window.mermaid.render(id, src)
            .then(({ svg }) => { view.innerHTML = svg; })
            .catch((e) => {
              // Graceful fallback: show the source with an error note, source-view by default.
              fig.classList.add("mermaid-failed");
              view.innerHTML = `<div class="mermaid-err">⚠ Couldn't render this diagram — showing source.</div>`;
              view.style.display = "none"; srcPre.style.display = "";
              showingSrc = true; btn.textContent = "▦ Diagram";
              const note = document.createElement("div");
              note.className = "mermaid-err"; note.textContent = String(e && e.message || e);
              srcPre.appendChild(note);
            });
        });
      }

      // ---------- reference previews + chip hover tooltips ----------
      // Short preview text for a block, cached. First meaningful line of its body (frontmatter and
      // leading heading hashes stripped). The daemon stays authoritative; this is display-only.
      const previewCache = new Map();
      function firstMeaningfulLine(src) {
        const s = String(src).replace(/^\uFEFF?---\r?\n[\s\S]*?\r?\n---\r?\n/, "");
        for (const line of s.split("\n")) {
          const t = line.trim();
          if (t) return t.replace(/^#+\s*/, "").slice(0, 140);
        }
        return "";
      }
      async function loadPreview(id) {
        if (previewCache.has(id)) return previewCache.get(id);
        let p = "";
        try { p = firstMeaningfulLine(await invoke("block_source", { id })); } catch {}
        previewCache.set(id, p);
        return p;
      }

      // A single custom tooltip with a deliberate delay so it never feels twitchy.
      let tipEl = null, tipTimer = null, hoverChip = null;
      function hideTip() {
        if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
        if (tipEl) { tipEl.remove(); tipEl = null; }
      }
      async function showTipFor(a) {
        const href = a.getAttribute("href") || "";
        if (!href.startsWith("mkb:")) return;
        const id = href.slice("mkb:".length).split("#")[0];
        const meta = indexCache && indexCache.find((b) => b.id === id);
        const title = meta ? (meta.title || id) : id;
        const preview = await loadPreview(id);
        if (hoverChip !== a || tipEl) return; // pointer left during load, or a newer hover won
        const el = document.createElement("div");
        el.className = "mkb-tip";
        el.innerHTML = `<div class="tt">${esc(title)}</div>` +
          (preview ? `<div class="tp">${esc(preview)}</div>` : `<div class="tp un">(empty block)</div>`);
        document.body.appendChild(el);
        tipEl = el;
        // Position just below the chip, clamped to the viewport.
        const r = a.getBoundingClientRect();
        el.style.left = r.left + "px";
        el.style.top = (r.bottom + 6) + "px";
        const tr = el.getBoundingClientRect();
        if (tr.right > window.innerWidth - 8) el.style.left = Math.max(8, window.innerWidth - 8 - tr.width) + "px";
        if (tr.bottom > window.innerHeight - 8) el.style.top = Math.max(8, r.top - tr.height - 6) + "px";
      }
      // Wire hover tooltips onto resolved wikilink chips under `root`. The hit target is the chip
      // element itself (no extra padding/zone); the tooltip fires ~1s after mouseenter and is
      // cleared on mouseleave. Unresolved chips get no tooltip and no affordance.
      function attachChipHovers(root) {
        root.querySelectorAll('a.wikilink[href^="mkb:"]').forEach((a) => {
          if (a.classList.contains("unresolved")) return;
          a.classList.add("hoverable");
          a.addEventListener("mouseenter", () => {
            hideTip();
            hoverChip = a;
            tipTimer = setTimeout(() => { tipTimer = null; showTipFor(a); }, 1000);
          });
          a.addEventListener("mouseleave", () => { hoverChip = null; hideTip(); });
        });
      }
      // A floating tooltip must not linger when the page moves.
      window.addEventListener("scroll", hideTip, true);

      // ---------- "references in this block" legend (outgoing, live) ----------
      // Parse the live editor text for [[link]] / ![[embed]] directives. Code spans and fenced
      // blocks are masked so example directives shown as code aren't counted, mirroring the core
      // parser; the daemon remains authoritative on save. Returns [{embed, target}] in order.
      function parseDirectives(text) {
        const masked = String(text)
          .replace(/```[\s\S]*?```/g, (m) => m.replace(/[^\n]/g, " "))
          .replace(/`[^`\n]*`/g, (m) => " ".repeat(m.length));
        const re = /(!?)\[\[([^\]\n|]+)(?:\|[^\]\n]*)?\]\]/g;
        const out = [];
        let m;
        while ((m = re.exec(masked))) out.push({ embed: m[1] === "!", target: m[2].trim() });
        return out;
      }
      // Resolve a directive target (ULID or title) to a known block, mirroring core resolution
      // (id first, then case-insensitive title) against the picker's block index.
      function resolveTarget(target) {
        if (!indexCache || !target) return null;
        const byId = indexCache.find((b) => b.id === target);
        if (byId) return byId;
        const lt = target.toLowerCase();
        return indexCache.find((b) => (b.title || "").toLowerCase() === lt) || null;
      }
      // Render the legend for `text` into the `#reflegend` container, deduped, with lazy previews
      // and click-to-open on resolved targets.
      function renderLegend(container, text) {
        if (!container) return;
        const dirs = parseDirectives(text);
        const seen = new Set();
        const items = [];
        for (const d of dirs) {
          const key = (d.embed ? "!" : "") + d.target.toLowerCase();
          if (seen.has(key)) continue;
          seen.add(key);
          items.push(d);
        }
        if (!items.length) {
          container.innerHTML = `<h4>References in this block</h4>` +
            `<div class="none">No links or embeds yet — type <code>[[</code> to add one.</div>`;
          return;
        }
        container.innerHTML = `<h4>References in this block (${items.length})</h4><ul>${
          items.map((d) => {
            const r = resolveTarget(d.target);
            const kind = d.embed ? `<span class="k embed">embed</span>` : `<span class="k">link</span>`;
            const title = r ? (r.title || r.id) : d.target;
            const go = r ? ` data-go="${esc(r.id)}"` : "";
            const pv = r ? ` data-pv="${esc(r.id)}"` : "";
            return `<li class="${r ? "" : "unresolved"}">${kind}<a class="t"${go}>${esc(title)}</a>` +
              `<span class="pv"${pv}></span></li>`;
          }).join("")
        }</ul>`;
        container.querySelectorAll("a.t[data-go]").forEach((a) =>
          (a.onclick = () => openBlock(a.dataset.go)));
        container.querySelectorAll(".pv[data-pv]").forEach(async (sp) => {
          const p = await loadPreview(sp.dataset.pv);
          if (p) sp.textContent = "— " + p;
        });
      }

      // ---------- block ops ----------
      // New block: open an UNSAVED draft editor. Nothing is written to disk until you Save —
      // Escape or Cancel discards it, so clicking + and changing your mind never leaves a stray
      // empty block. Creation happens on save via create_block.
      function newBlock() {
        active = null; currentView = "edit"; renderNav(); mode = "edit"; mainEl.scrollTop = 0;
        mainEl.innerHTML = topbarDraft() + `<div class="pad" id="body"></div>`;
        const body = mainEl.querySelector("#body");
        body.innerHTML = `<input class="titleedit" id="t" placeholder="Title (optional)" />
          <textarea class="editarea" id="b" spellcheck="false" style="min-height:50vh" placeholder="Write Markdown…  ⌘↵ to create · Esc to discard"></textarea>
          <div class="editbar">
            <button class="primary" id="save">Create block</button>
            <button id="cancel">Cancel</button>
            <button id="attach" title="Add an image to the vault and insert it here">🖼 Add image</button>
            <input type="file" id="imgfile" accept="image/*" multiple hidden />
            <span class="muted" id="msg">New block — nothing is saved until you create it. Type <code>[[</code> to link · drag, paste, or add an image.</span>
          </div>`;
        const tt = body.querySelector("#t"), ta = body.querySelector("#b");
        attachPicker(ta);
        // Restore an unsaved new-block draft (survives a mobile tab reload); persist on every input.
        const _nd = readDraft(null);
        if (_nd && ((_nd.title && _nd.title.length) || (_nd.body && _nd.body.length))) {
          tt.value = _nd.title || ""; ta.value = _nd.body || "";
          toast("Restored an unsaved draft.");
        }
        const persistNew = () => persistDraft(null, { title: tt.value, body: ta.value });
        tt.addEventListener("input", persistNew);
        ta.addEventListener("input", persistNew);
        wireImageImport(ta, body.querySelector("#msg"), body.querySelector("#imgfile"), body.querySelector("#attach"));
        const discard = () => { dropDraft(null); mode = "read"; loadBlocks(); if (active) openBlock(active); else mainEl.innerHTML = `<div class="pad"><p class="muted">Select or create a block.</p></div>`; };
        const create = async () => {
          const title = tt.value.trim() || null;
          if (!title && !ta.value.trim()) { discard(); return; }  // empty → just discard
          try {
            const id = await invoke("create_block", { title, body: ta.value });
            dropDraft(null); invalidate(); await loadBlocks(id); mode = "edit"; openBlock(id, true);
          } catch (e) { body.querySelector("#msg").textContent = String(e); }
        };
        body.querySelector("#save").onclick = create;
        body.querySelector("#cancel").onclick = discard;
        // Esc discards the draft (unless the [[ picker is open, which eats Esc to close itself).
        tt.addEventListener("keydown", draftKeys);
        ta.addEventListener("keydown", draftKeys);
        function draftKeys(e) {
          if (e.key === "Escape" && !pickerOpen()) { e.preventDefault(); discard(); }
          else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); create(); }
        }
        tt.focus();
      }

      // A minimal topbar for the unsaved draft (no view tabs, no tag editor, no delete).
      function topbarDraft() {
        return `<div class="topbar"><div class="titlewrap"><h1>New block</h1></div></div>`;
      }

      // Shared inline "new block" draft editor. `place(wrapEl)` inserts the editor into the DOM;
      // `commit(childId)` links the freshly-created block (append / at-offset); `cancelView()`
      // restores the view. The block is created only on a non-empty Save, so bailing
      // (Esc/Cancel/empty) writes nothing — no orphan block, no dangling ![[embed]]. Used by the
      // hover-to-insert "+" gaps between blocks.
      function draftBlockEditor(place, commit, cancelView) {
        const wrap = document.createElement("div");
        wrap.className = "addblock-inline";
        const ta = document.createElement("textarea");
        ta.className = "editarea"; ta.spellcheck = false;
        ta.placeholder = "Write the new block’s Markdown…";
        // Restore an unsaved draft (survives a mobile tab reload); a distinct key from the full-page
        // new-block composer so the two don't clobber each other.
        const _cd = readDraft("__newchild__");
        if (_cd && typeof _cd.body === "string" && _cd.body.length) { ta.value = _cd.body; toast("Restored an unsaved draft."); }
        ta.addEventListener("input", () => persistDraft("__newchild__", { body: ta.value }));
        wrap.appendChild(ta);
        const bar = document.createElement("div");
        bar.className = "editbar";
        bar.innerHTML = `<button class="primary" data-a="save">Add block</button><button data-a="cancel">Cancel</button>`+
          `<span class="muted">⌘↵ add · Esc discard · type <code>[[</code> to link</span>`;
        wrap.appendChild(bar);
        place(wrap);
        autosize(ta); ta.focus();
        attachPicker(ta);
        let finished = false;
        const cancel = () => { if (finished) return; finished = true; dropDraft("__newchild__"); cancelView(); };
        const save = async () => {
          if (finished) return;
          if (!ta.value.trim()) { cancel(); return; } // empty draft: create nothing
          finished = true;
          try {
            const child = await invoke("create_block", { title: null, body: ta.value });
            dropDraft("__newchild__");
            await commit(child);
            invalidate(); await loadBlocks(active); await openBlock(active, true);
          } catch (e) { toast(String(e), "error"); finished = false; }
        };
        bar.querySelector('[data-a="save"]').onclick = save;
        bar.querySelector('[data-a="cancel"]').onclick = cancel;
        ta.addEventListener("input", () => autosize(ta));
        ta.addEventListener("keydown", (e) => {
          if (pickerOpen()) return;
          if (e.key === "Escape") { e.preventDefault(); cancel(); }
          else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
        });
      }

      async function del(id, returnTo) {
        const ok = await confirmModal("Delete this block? Its file will be removed.", { confirmLabel: "Delete", danger: true });
        if (!ok) return;
        try {
          await invoke("delete_block", { id });
          invalidate();
          if (returnTo && returnTo !== id) { await loadBlocks(returnTo); await openBlock(returnTo, true); }
          else { active = null; await loadBlocks(); }
        } catch (e) { toast(String(e), "error"); }
      }

      // Remove a child's embed/reference from a page without deleting the block itself.
      async function removeFromPage(parentId, childId) {
        try {
          await invoke("unlink_blocks", { sourceId: parentId, targetId: childId });
          invalidate(); await loadBlocks(parentId); await openBlock(parentId, true);
          toast("Removed from page ✓");
        } catch (e) { toast(String(e), "error"); }
      }

      // Delete a child block from within a page: unlink its embed from the parent first (so the page
      // isn't left with a dangling ![[…]]), then delete the block itself.
      async function deleteChildFromPage(parentId, childId) {
        const ok = await confirmModal("Delete this block? Its file will be removed and its embed taken off this page.", { confirmLabel: "Delete", danger: true });
        if (!ok) return;
        try {
          await invoke("unlink_blocks", { sourceId: parentId, targetId: childId });
          await invoke("delete_block", { id: childId });
          invalidate(); await loadBlocks(parentId); await openBlock(parentId, true);
        } catch (e) { toast(String(e), "error"); }
      }

      // ---------- graph ----------
      async function showGraph() {
        active = null; currentView = "graph"; renderNav();
        mainEl.innerHTML = `<div id="graphview"></div>
          <div class="glegend" id="glegend">
            <div class="glegend-body">
              <div class="glegend-col glegend-keys">
                <button class="glegend-toggle" id="glegendToggle" title="Hide/show the legend & controls">Legend <span id="glegendChevron">▾</span></button>
                <div class="glegend-col-body" id="glegendBody">
                  <label class="lg lgtoggle"><input type="checkbox" id="vRoot" checked/><span class="keyL"><span class="sw" style="background:var(--accent)"></span></span><span>Root block <span class="lgmuted">— nothing embeds it</span></span></label>
                  <label class="lg lgtoggle"><input type="checkbox" id="vLinked" checked/><span class="keyL"><span class="sw" style="background:var(--mauve)"></span></span><span>Embedded / linked block</span></label>
                  <label class="lg lgtoggle"><input type="checkbox" id="vEmbed" checked/><span class="keyL"><span class="edgekey solid" style="border-color:var(--mauve)"></span></span><span>Embeds <code>![[ ]]</code></span></label>
                  <label class="lg lgtoggle"><input type="checkbox" id="vRef" checked/><span class="keyL"><span class="edgekey dashed" style="border-color:var(--accent)"></span></span><span>References <code>[[ ]]</code></span></label>
                  <label class="lg lgtoggle"><input type="checkbox" id="vTags" checked/><span class="keyL"><span class="sw tag" style="background:var(--tag)"></span></span><span>Tags</span></label>
                  <div class="lgfoot lgmuted">Size = connections · click to open · drag to move · scroll to zoom</div>
                </div>
              </div>
              <div class="glegend-col glegend-panel" id="glegendPanel">
                <span class="glegend-head">Layout</span>
                <div class="glegend-col-body" id="glegendPanelBody">
                  <label class="gslider"><span>Labels</span>
                    <select id="vLabels">
                      <option value="auto" selected>Auto (on zoom)</option>
                      <option value="full">Always</option>
                      <option value="trunc">Truncated</option>
                      <option value="off">Hidden</option>
                    </select></label>
                  <label class="gslider" title="Spread connected nodes apart or pull them tighter"><span>Spread</span>
                    <input type="range" id="gspread" min="0.3" max="3" step="0.1" value="1"/></label>
                  <label class="gslider" title="Pull the whole graph toward the center (tighter) or let it relax (looser)"><span>Gravity</span>
                    <input type="range" id="ggravity" min="0" max="0.2" step="0.005" value="0.05"/></label>
                  <label class="gslider" title="Repulsion strength between nodes (stronger = more spread)"><span>Charge</span>
                    <input type="range" id="gcharge" min="0.3" max="3" step="0.1" value="1"/></label>
                  <div class="gpanel-actions">
                    <button id="greheat" title="Re-run the layout">↻ Reheat</button>
                    <button id="gstop" title="Freeze all forces so nodes stop moving (toggle)">⏸ Freeze</button>
                    <button id="graphfit" title="Fit the whole graph on screen (or double-click the background)">⤢ Fit</button>
                  </div>
                </div>
              </div>
            </div>
          </div>`;
        let g;
        try { g = graphCache || (graphCache = await invoke("graph")); }
        catch (e) { mainEl.innerHTML = `<div class="pad"><p class="muted">${esc(e)}</p></div>`; return; }
        let tagsOn = true;          // tags shown by default
        let showEmbed = true;       // ![[embed]] edges
        let showRef = true;         // [[reference]] edges
        let showRoot = true;        // root block nodes (nothing embeds them)
        let showLinked = true;      // embedded / linked block nodes
        let hover = null;
        const el = document.getElementById("graphview");
        // Drawn radius of a node (grows with its connection count). Shared with the collision
        // force below so nodes never visually overlap.
        const nodeR = (n) => Math.max(2.4, Math.cbrt((n.d || 0) + 1) * 2.6);
        // Build the force-graph nodes/links for the current visibility flags. Block edges are
        // filtered by kind (embed/reference); tag nodes + block→tag edges are added when tagsOn.
        // Orphaned block nodes (no visible edge) are kept so the block is still reachable. Recomputes
        // per-node degree (drives size) and neighbour sets (drives hover-dim).
        let nodes = [], links = [], neighbors = {};
        function buildData() {
          // Which block nodes are visible (root vs embedded/linked can each be hidden).
          const vis = new Set();
          g.nodes.forEach((n) => { if (n.root ? showRoot : showLinked) vis.add(n.id); });
          links = g.edges
            .filter((e) => {
              const k = String(e.kind || "").toLowerCase();
              if (!vis.has(e.source) || !vis.has(e.target)) return false; // both ends must be shown
              return k === "transcludes" ? showEmbed : showRef;
            })
            .map((e) => ({ source: e.source, target: e.target, kind: e.kind }));
          if (tagsOn) {
            g.nodes.forEach((n) => { if (vis.has(n.id)) (n.tags || []).forEach((t) => {
              links.push({ source: n.id, target: "tag:" + t, kind: "tag" });
            }); });
          }
          // Degree from the *visible* links so node size reflects what's shown.
          const deg = {};
          links.forEach((l) => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
          nodes = g.nodes.filter((n) => vis.has(n.id))
            .map((n) => ({ id: n.id, label: n.title, d: (deg[n.id] || 0), root: n.root, kind: "block" }));
          if (tagsOn) {
            const tagIds = new Set();
            g.nodes.forEach((n) => { if (vis.has(n.id)) (n.tags || []).forEach((t) => tagIds.add("tag:" + t)); });
            nodes = nodes.concat([...tagIds].map((tid) => ({ id: tid, label: "#" + tid.slice(4), d: (deg[tid] || 0), kind: "tag" })));
          }
          neighbors = {};
          links.forEach((l) => {
            const s = l.source.id || l.source, t = l.target.id || l.target;
            (neighbors[s] = neighbors[s] || new Set()).add(t);
            (neighbors[t] = neighbors[t] || new Set()).add(s);
          });
        }
        buildData();
        // Theme-aware colours (read live so a theme toggle re-skins the canvas on re-render).
        const tc = themeColors();
        const lightUI = !effectiveDark();
        const rgba = (hex, a) => {
          const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex).trim());
          return m ? `rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${a})` : hex;
        };
        // Edge opacity: on the light "paper" background the same colours read fainter, so bump
        // their alpha a touch. The canvas itself is lightened in light mode (below), which restores
        // label/line contrast, so tags don't need to be cranked the way they did on the dark panel.
        const aEmbed = lightUI ? 0.75 : 0.6, aRef = lightUI ? 0.6 : 0.45, aTag = lightUI ? 0.6 : 0.32;
        const tagLine = lightUI ? "#b5710e" : tc.tag;
        let labelMode = "auto"; // "auto" (on zoom/hover) | "full" | "trunc" | "off"
        const labelOf = (n) => {
          const s = n.label || n.id;
          if (labelMode !== "trunc" || n.kind === "tag") return s;
          const first = String(s).trim().split(/\s+/)[0] || s;
          return first.length < String(s).length ? first + "…" : first;
        };
        fg = ForceGraph()(el)
          .backgroundColor(lightUI ? tc.field : tc.panel)
          .graphData({ nodes, links })
          // Edge kind, surfaced visually so embeds read differently from plain links:
          //   • transclusion (![[embed]]) — solid, brighter, slightly thicker (the stronger tie)
          //   • reference   ([[link]])   — dashed, cooler/dimmer, thinner
          //   • block→tag membership      — dotted, warm, no arrow
          // Core serializes the kind as PascalCase ("References"/"Transcludes"); compare lowercased.
          .linkColor((l) => {
            const k = String(l.kind || "").toLowerCase();
            if (k === "tag") return rgba(tagLine, aTag);
            if (k === "references") return rgba(tc.accent, aRef); // reference (link)
            return rgba(tc.mauve, aEmbed);                        // embed (transclusion)
          })
          .linkWidth((l) => {
            const k = String(l.kind || "").toLowerCase();
            return k === "transcludes" ? 1.6 : (k === "tag" ? 1.0 : 0.7);
          })
          .linkLineDash((l) => {
            const k = String(l.kind || "").toLowerCase();
            return k === "references" ? [3, 2] : (k === "tag" ? [1, 3] : null);
          })
          .linkDirectionalArrowLength((l) => l.kind === "tag" ? 0 : 3)
          .nodeCanvasObject((n, ctx, scale) => {
            const r = nodeR(n);
            const dim = hover && hover !== n.id && !(neighbors[hover] && neighbors[hover].has(n.id));
            ctx.globalAlpha = dim ? 0.18 : 1;
            if (n.kind === "tag") {
              // Diamond + warm colour so tags never read as blocks.
              ctx.beginPath();
              ctx.moveTo(n.x, n.y - r); ctx.lineTo(n.x + r, n.y); ctx.lineTo(n.x, n.y + r); ctx.lineTo(n.x - r, n.y); ctx.closePath();
              ctx.fillStyle = tc.tag; ctx.fill();
            } else {
              ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
              ctx.fillStyle = n.root ? tc.accent : tc.mauve; ctx.fill();
            }
            const hot = hover && (hover === n.id || (neighbors[hover] && neighbors[hover].has(n.id)));
            const showLabel = labelMode === "off" ? false
              : labelMode === "auto" ? (scale > 1.1 || hot)
              : true;
            if (showLabel) {
              ctx.globalAlpha = dim ? 0.25 : 1;
              ctx.font = `${11/scale}px -apple-system, sans-serif`;
              ctx.fillStyle = n.kind === "tag" ? tc.tag : tc.fg; ctx.textAlign = "left"; ctx.textBaseline = "middle";
              ctx.fillText(labelOf(n), n.x + r + 1.5, n.y);
            }
            ctx.globalAlpha = 1;
          })
          .onNodeHover((n) => { hover = n ? n.id : null; el.style.cursor = n ? "pointer" : "default"; })
          .onNodeClick((n) => { if (n.kind !== "tag") openBlock(n.id); })
          .width(el.clientWidth).height(el.clientHeight);
        // Make movement explicit: drag the background to pan, scroll to zoom, drag a node to move
        // it. (These are force-graph defaults, but set them explicitly so the canvas owns the
        // gestures rather than the scrollable <main> around it.)
        fg.enablePanInteraction(true).enableZoomInteraction(true).enableNodeDrag(true);
        // Layout (single regime, matching a proven d3-force setup). Charge is a strong, constant,
        // long-range repulsion that spreads and untangles the graph; it isn't "always pushing" —
        // the simulation's alpha decays to zero and everything freezes, and a drag/Reheat just
        // reheats with the SAME charge, so the layout stays spread instead of collapsing. The thing
        // that stops two disconnected clusters drifting apart forever is a gentle gravity toward the
        // origin (links only pull *connected* nodes). Collision keeps circles from overlapping.
        const N = nodes.length;
        const BASE_CHARGE = Math.min(-90, -70 - N * 1.5); // stronger with more nodes
        const BASE_LINK = Math.max(34, 24 + N * 0.6);
        let spread = 1;        // Spread slider multiplier
        let gravityK = 0.05;   // Gravity slider: pull toward origin (tighter when higher)
        let chargeK = 1;       // Charge slider: repulsion multiplier
        let frozen = false;    // Freeze toggle: pin every node so forces stop moving them
        fg.d3Force("charge").strength(() => BASE_CHARGE * spread * chargeK);
        fg.d3Force("link").distance(() => BASE_LINK * spread);
        // Custom forces — the bundled d3 force factories are minified-away, so we supply our own.
        // Gravity: pull every node toward the origin (≈ forceX(0)+forceY(0)) so components converge.
        // Reads `gravityK` live so the Gravity slider takes effect without rebuilding the force.
        const gravity = () => {
          let ns = [];
          const f = (alpha) => { for (const n of ns) { n.vx -= n.x * gravityK * alpha; n.vy -= n.y * gravityK * alpha; } };
          f.initialize = (n) => { ns = n; };
          return f;
        };
        // Collision: separate only the pairs whose circles actually overlap (radius + padding).
        const collision = (pad) => {
          let ns = [];
          const f = () => {
            for (let i = 0; i < ns.length; i++) {
              const a = ns[i];
              for (let j = i + 1; j < ns.length; j++) {
                const b = ns[j];
                let dx = b.x - a.x, dy = b.y - a.y;
                const r = nodeR(a) + nodeR(b) + pad;
                const d2 = dx * dx + dy * dy;
                if (d2 > 1e-6 && d2 < r * r) {
                  const d = Math.sqrt(d2);
                  const push = (r - d) / d * 0.5;
                  dx *= push; dy *= push;
                  b.vx += dx; b.vy += dy; a.vx -= dx; a.vy -= dy;
                }
              }
            }
          };
          f.initialize = (n) => { ns = n; };
          return f;
        };
        fg.d3Force("gravity", gravity());
        fg.d3Force("collision", collision(4));
        // Re-frame once per requested (re)layout, after it settles.
        let refitNext = true;
        fg.onEngineStop(() => { if (refitNext) { refitNext = false; fg.zoomToFit(400, 40); } });
        // Re-size on the next frame (not synchronously inside the observer) so resizing the
        // canvas can't re-enter this same observer in the current frame — which is what emits
        // the benign "ResizeObserver loop completed with undelivered notifications" warning.
        let roPending = false;
        const ro = new ResizeObserver(() => {
          if (roPending) return;
          roPending = true;
          requestAnimationFrame(() => {
            roPending = false;
            if (fg) fg.width(el.clientWidth).height(el.clientHeight);
          });
        });
        ro.observe(el);
        // Controls. Fit (or double-click) re-frames the graph. Reheat re-runs the layout. Spread
        // scales repulsion + link length so you can pull a dense graph tighter or spread it out.
        const fit = () => fg.zoomToFit(400, 40);
        const relayout = () => { if (frozen) return; refitNext = true; fg.d3ReheatSimulation(); };
        document.getElementById("graphfit").onclick = fit;
        el.addEventListener("dblclick", fit);
        document.getElementById("greheat").onclick = relayout;
        document.getElementById("gspread").oninput = (e) => { spread = parseFloat(e.target.value) || 1; relayout(); };
        document.getElementById("ggravity").oninput = (e) => { gravityK = parseFloat(e.target.value) || 0; relayout(); };
        document.getElementById("gcharge").oninput = (e) => { chargeK = parseFloat(e.target.value) || 1; relayout(); };
        // Freeze: pin every node at its current position so no force can move it (the most robust
        // "stop all forces"). Resume releases the pins and reheats. While frozen, dropping a dragged
        // node re-pins it where you left it (force-graph clears fx/fy on drag-end by default).
        const stopBtn = document.getElementById("gstop");
        const setFrozen = (on) => {
          frozen = on;
          for (const n of nodes) { if (on) { n.fx = n.x; n.fy = n.y; } else { n.fx = null; n.fy = null; } }
          stopBtn.textContent = on ? "▶ Resume" : "⏸ Freeze";
          stopBtn.classList.toggle("on", on);
          if (!on) { refitNext = false; fg.d3ReheatSimulation(); }
        };
        stopBtn.onclick = () => setFrozen(!frozen);
        fg.onNodeDragEnd((n) => { if (frozen) { n.fx = n.x; n.fy = n.y; } });
        // Rebuild the visible graph after a visibility toggle (embeds/refs/tags). buildData() makes
        // fresh node objects, so lift any freeze first and let the new topology lay out.
        const rebuild = () => { if (frozen) setFrozen(false); buildData(); fg.graphData({ nodes, links }); refitNext = true; fg.d3ReheatSimulation(); };
        document.getElementById("vRoot").onchange = (e) => { showRoot = e.target.checked; rebuild(); };
        document.getElementById("vLinked").onchange = (e) => { showLinked = e.target.checked; rebuild(); };
        document.getElementById("vEmbed").onchange = (e) => { showEmbed = e.target.checked; rebuild(); };
        document.getElementById("vRef").onchange = (e) => { showRef = e.target.checked; rebuild(); };
        document.getElementById("vTags").onchange = (e) => { tagsOn = e.target.checked; rebuild(); };
        // Labels mode just changes painted text (no layout change). Re-setting the node painter
        // accessor marks the canvas dirty so force-graph repaints on the next frame, without a reheat.
        document.getElementById("vLabels").onchange = (e) => { labelMode = e.target.value; fg.nodeCanvasObject(fg.nodeCanvasObject()); };
        // Collapsible legend cluster. "Legend ▾" collapses the keys list AND hides the controls
        // column. The legend's collapsed state persists.
        const legendBody = document.getElementById("glegendBody");
        const legendChevron = document.getElementById("glegendChevron");
        const panel = document.getElementById("glegendPanel");
        const applyLegend = (c) => { legendBody.style.display = c ? "none" : ""; panel.style.display = c ? "none" : ""; legendChevron.textContent = c ? "▸" : "▾"; };
        let legendCollapsed = false;
        try { legendCollapsed = localStorage.getItem("mkb.graphLegend") === "collapsed"; } catch {}
        applyLegend(legendCollapsed);
        document.getElementById("glegendToggle").onclick = () => {
          legendCollapsed = !legendCollapsed;
          applyLegend(legendCollapsed);
          try { localStorage.setItem("mkb.graphLegend", legendCollapsed ? "collapsed" : "open"); } catch {}
        };
      }
