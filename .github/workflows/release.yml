name: Release (native binaries)

# Tag-only. This repo's primary CI lives in Forgejo (.forgejo/workflows). This GitHub
# workflow cuts a SELF-CONTAINED native release on GitHub-hosted runners: each platform job
# produces BOTH the headless payload (daemon-with-onnx + thin clients) AND
# the desktop app with its native installer (Tauri), built natively on that OS — it does not
# rely on Forgejo's cross-build for any part of the release. It runs when a version tag rides
# the Forgejo->GitHub push-mirror up.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Required so the Windows leg can mint a GitHub OIDC token for `azure/login` (federated
  # credentials, no stored client secret). Harmless on the other legs — a token is only
  # requested where `azure/login` runs.
  id-token: write

jobs:
  release:
    # No-op anywhere but GitHub: Forgejo populates github.server_url with its own instance URL,
    # so if it ever reads this file the job is simply skipped (it also has no macOS/Windows
    # runners). On GitHub this is https://github.com and the job runs.
    if: ${{ github.server_url == 'https://github.com' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The `release` environment is what the Azure federated credential is scoped to
    # (subject `repo:<owner>/<repo>:environment:release`), so the Windows OIDC login can
    # exchange the token. Applied to the whole release job for consistency; any protection
    # rules on this environment (e.g. required reviewers) therefore gate the entire release.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  name: linux-amd64 }
          # Linux arm64 — HEADLESS only (daemon + CLIs, no desktop GUI). Cross-compiled
          # on the amd64 runner (a webkit-linked GUI doesn't cross-compile cleanly, and free
          # hosted arm64 runners are public-repo only), matching the Forgejo pipeline. The app
          # for arm64 Linux is build-from-source only.
          - { os: ubuntu-latest,    target: aarch64-unknown-linux-gnu, name: linux-arm64, headless: true }
          # macos-amd64 (Intel): dropped on private repos — macOS runners bill at 10x minutes,
          # so we ship only Apple Silicon. Re-enable for Intel-mac coverage if desired.
          # - { os: macos-13,         target: x86_64-apple-darwin,       name: macos-amd64 }
          - { os: macos-14,         target: aarch64-apple-darwin,      name: macos-arm64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: windows-amd64 }

    # ── macOS code signing + notarization (OPTIONAL — CURRENTLY DISABLED) ─────────────
    # Without these, the macOS app is ad-hoc signed and NOT notarized, so a browser
    # download triggers Gatekeeper's misleading "mkb.app is damaged and can't be opened"
    # on Apple Silicon (the only workaround is `xattr -dr com.apple.quarantine mkb.app`).
    #
    # The wiring is WRITTEN and matches the repo's actual Apple secrets, but left COMMENTED
    # OUT for now. With this commented, `cargo tauri build` finds no APPLE_* env and ad-hoc
    # signs (build still works; other platforms unaffected). To re-enable: (1) restore the
    # job-level `env:` block below, (2) uncomment the "Import Apple signing certificate" step.
    # The secret names already match.
    #
    # This repo authenticates notarization with an App Store Connect API KEY (not Apple-ID +
    # app-specific-password), so the notarization vars are APPLE_API_ISSUER / _KEY / _KEY_PATH
    # per Tauri's docs; the private key (.p8) comes base64 in APPLE_API_KEY_BASE64 and is
    # written to disk in the import step.
    #   APPLE_CERT_BASE64       base64 of the exported .p12 (Developer ID Application)
    #   APPLE_CERT_PASSWORD     the password set when exporting the .p12
    #   APPLE_TEAM_ID           your 10-char Apple Team ID
    #   APPLE_API_KEY_BASE64    base64 of the App Store Connect API key (.p8)
    #   APPSTORE_ISSUER_ID      the App Store Connect API issuer id
    #   APPSTORE_KEY_ID         the App Store Connect API key id  (add this secret when enabling)
    #   KEYCHAIN_PASSWORD       any throwaway password for the temp CI keychain (add when enabling)
    #
    # env:
    #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERT_BASE64 }}
    #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
    #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    #   APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
    #   APPLE_API_KEY: ${{ secrets.APPSTORE_KEY_ID }}
    #   KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      # Cross linker for the headless arm64 build (the Rust target itself is added by the
      # toolchain action above). ort downloads a prebuilt aarch64 onnxruntime and fastembed uses
      # rustls, so no arm64 system C libraries are needed — same approach as the Forgejo image.
      - name: Install aarch64 cross toolchain (headless arm64)
        if: matrix.headless == true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
          } >> "$GITHUB_ENV"

      # Daemon (semantic search built in by default; ort downloads the platform's prebuilt
      # onnxruntime at build time); clients are thin.
      - name: Build (native)
        shell: bash
        run: |
          set -eux
          cargo build --release --target ${{ matrix.target }} -p mkbd
          cargo build --release --target ${{ matrix.target }} -p mkb-cli -p mkb-mcp -p mkb-web

      # ── Desktop app (Tauri) ──────────────────────────────────────────────────────
      # Build the desktop app + its native installer on this same runner so the release for
      # this platform is complete on its own. The app bundles the onnx daemon built above as a
      # resource (src-tauri/bin/ is bundled whole via bundle.resources "bin/"), so
      # local-vault auto-start works from the installed app. The frontend is static (../ui), so
      # no Node toolchain is needed.
      - name: Install Linux desktop bundling deps
        if: runner.os == 'Linux' && matrix.headless != true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file libxdo-dev libssl-dev

      - name: Install Tauri CLI
        if: matrix.headless != true
        shell: bash
        run: cargo install --locked tauri-cli --version '^2'

      # Import the Developer ID cert into a temporary keychain so `cargo tauri build` can sign
      # with it, and write the App Store Connect API key (.p8) for notarization. COMMENTED OUT
      # alongside the APPLE_* env block above — re-enable both together to turn macOS signing on.
      # (Names already match the repo's secrets; when enabling, also add APPSTORE_KEY_ID and
      # KEYCHAIN_PASSWORD secrets and point APPLE_API_KEY_PATH at the written .p8.)
      # - name: Import Apple signing certificate
      #   if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
      #   shell: bash
      #   run: |
      #     set -eu
      #     CERT="$RUNNER_TEMP/certificate.p12"
      #     echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
      #     security set-keychain-settings -t 3600 -u build.keychain
      #     security import "$CERT" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      #     IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
      #     echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      #     rm -f "$CERT"
      #     # App Store Connect API key (.p8) for notarization; expose its path to `cargo tauri build`.
      #     KEY="$RUNNER_TEMP/AuthKey.p8"
      #     echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "$KEY"
      #     echo "APPLE_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      # ── Windows code signing (Azure Artifact Signing via OIDC) ─────────────────────
      # Sign every Windows executable so neither the installer nor any bundled/loose binary
      # trips SmartScreen's "unknown publisher". Uses the verified azure/artifact-signing-action
      # with OIDC federated credentials (no stored client secret): `azure/login` establishes the
      # `az` session and the action funnels DefaultAzureCredential to AzureCliCredential (hence the
      # exclude-* toggles, all true except azure-cli). Ordering matters — a signed exe must be
      # signed BEFORE it is packaged, so we build without bundling, sign the app + sidecars, then
      # bundle, then sign the installer. The three signing-resource coordinates are non-secret but
      # live in repo secrets here (ARTIFACT_SIGNING_ENDPOINT/ACCOUNT/PROFILE).
      - name: Azure login (OIDC) — Windows signing
        if: runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Sign the standalone daemon + CLIs at their build location. These same signed binaries are
      # both staged into the app bundle (below) and shipped loose in the .zip, so one signing pass
      # here covers both.
      - name: Sign standalone binaries (Windows)
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\${{ matrix.target }}\release\mkbd.exe
            ${{ github.workspace }}\target\${{ matrix.target }}\release\mkb.exe
            ${{ github.workspace }}\target\${{ matrix.target }}\release\mkb-mcp.exe
            ${{ github.workspace }}\target\${{ matrix.target }}\release\mkb-web.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # Build the desktop app WITHOUT bundling, so the main exe exists to be signed before NSIS
      # packages it. Stage the (now signed) sidecars as app resources first — `tauri bundle` copies
      # bundle.resources at bundle time, so the installer will embed the signed copies.
      - name: Build desktop app — no bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eux
          ( cd app/mkb-tauri && cargo tauri icon app-icon.png )
          D="target/${{ matrix.target }}/release"
          mkdir -p app/mkb-tauri/src-tauri/bin
          cp "$D/mkbd.exe"    app/mkb-tauri/src-tauri/bin/mkbd.exe
          cp "$D/mkb-mcp.exe" app/mkb-tauri/src-tauri/bin/mkb-mcp.exe
          cp "$D/mkb.exe"     app/mkb-tauri/src-tauri/bin/mkb.exe
          cp "$D/mkb-web.exe" app/mkb-tauri/src-tauri/bin/mkb-web.exe
          ( cd app/mkb-tauri/src-tauri && \
            cargo tauri build --no-bundle --target ${{ matrix.target }} )

      - name: Sign app binary (Windows)
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\app\mkb-tauri\src-tauri\target\${{ matrix.target }}\release\mkb-tauri.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # Now package the signed app + signed sidecars into the NSIS installer (reuses the already
      # built binary — `tauri bundle` does not recompile).
      - name: Bundle installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eux
          ( cd app/mkb-tauri/src-tauri && \
            cargo tauri bundle --bundles nsis --target ${{ matrix.target }} )

      - name: Sign installer (Windows)
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\app\mkb-tauri\src-tauri\target\${{ matrix.target }}\release\bundle\nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Build desktop app (Tauri)
        # Windows is handled by the dedicated build/sign/bundle/sign steps above.
        if: runner.os != 'Windows' && matrix.headless != true
        shell: bash
        env:
          # Build the AppImage without requiring FUSE on the CI runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -eux
          # Generate the icon set from the single tracked source (icons/ is git-ignored build output).
          ( cd app/mkb-tauri && cargo tauri icon app-icon.png )
          D="target/${{ matrix.target }}/release"
          mkdir -p app/mkb-tauri/src-tauri/bin
          # Stage the daemon (local-vault auto-start), the CLI tools (mkb + mkb-mcp), and the web UI
          # server (mkb-web) as app resources under their real command names. macOS exposes them on
          # PATH via the app's first-run /usr/local/bin symlinks; the Linux .deb ships them to the
          # system bin.
          case "${{ runner.os }}" in
            macOS)
              cp "$D/mkbd"   app/mkb-tauri/src-tauri/bin/mkbd
              cp "$D/mkb-mcp" app/mkb-tauri/src-tauri/bin/mkb-mcp
              cp "$D/mkb"     app/mkb-tauri/src-tauri/bin/mkb
              cp "$D/mkb-web" app/mkb-tauri/src-tauri/bin/mkb-web
              BUNDLES=app,dmg ;;
            *)
              cp "$D/mkbd"   app/mkb-tauri/src-tauri/bin/mkbd
              cp "$D/mkb-mcp" app/mkb-tauri/src-tauri/bin/mkb-mcp
              cp "$D/mkb"     app/mkb-tauri/src-tauri/bin/mkb
              cp "$D/mkb-web" app/mkb-tauri/src-tauri/bin/mkb-web
              BUNDLES=deb,appimage ;;
          esac
          ( cd app/mkb-tauri/src-tauri && \
            cargo tauri build --target ${{ matrix.target }} --bundles "$BUNDLES" )

      - name: Collect desktop installer(s)
        if: matrix.headless != true
        shell: bash
        run: |
          set -eux
          V="${{ github.ref_name }}"
          N="${{ matrix.name }}"
          B="app/mkb-tauri/src-tauri/target/${{ matrix.target }}/release/bundle"
          sum() { ( sha256sum "$1" 2>/dev/null || shasum -a 256 "$1" ) > "$1.sha256"; }
          case "${{ runner.os }}" in
            Windows)
              cp "$B"/nsis/*-setup.exe "mkb-$V-$N-setup.exe"
              sum "mkb-$V-$N-setup.exe" ;;
            macOS)
              cp "$B"/dmg/*.dmg "mkb-$V-$N.dmg"
              sum "mkb-$V-$N.dmg" ;;
            *)
              cp "$B"/appimage/*.AppImage "mkb-$V-$N.AppImage"
              cp "$B"/deb/*.deb           "mkb-$V-$N.deb"
              sum "mkb-$V-$N.AppImage"
              sum "mkb-$V-$N.deb" ;;
          esac

      # ONE complete archive per platform: the desktop app + every CLI (mkb, mkb-mcp) + the web UI
      # server (mkb-web) + the daemon. The daemon is self-contained — the embedding model is compiled
      # into the binary — so no model files ship alongside. Every download is the full product, never
      # a split. macOS ships the .app; Linux ships the runnable .AppImage (a bare mkb-tauri binary
      # needs system webkit, the AppImage bundles it); Windows ships mkb-tauri.exe.
      - name: Assemble complete archive (Unix)
        if: runner.os != 'Windows' && matrix.headless != true
        shell: bash
        run: |
          set -eux
          V="${{ github.ref_name }}"; N="${{ matrix.name }}"
          D="target/${{ matrix.target }}/release"
          B="app/mkb-tauri/src-tauri/target/${{ matrix.target }}/release/bundle"
          rm -rf dist && mkdir -p dist
          cp "$D/mkbd" "$D/mkb" "$D/mkb-mcp" "$D/mkb-web" dist/
          for lib in "$D"/libonnxruntime*.so* "$D"/libonnxruntime*.dylib; do
            [ -e "$lib" ] && cp "$lib" dist/ || true
          done
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "$B"/macos/*.app dist/
          else
            cp "$B"/appimage/*.AppImage "dist/mkb.AppImage"
          fi
          A="mkb-$V-$N.tar.gz"
          tar -C dist -czf "$A" .
          ( sha256sum "$A" 2>/dev/null || shasum -a 256 "$A" ) > "$A.sha256"

      # Headless archive (Linux arm64): daemon + CLIs + web UI server, no desktop app. `mkb-web` is
      # the way to get the GUI on a platform with no desktop bundle — run it and open a browser.
      # Named `-headless` so it never reads as the complete product — matching the Forgejo arm64 tarball.
      - name: Assemble headless archive
        if: matrix.headless == true
        shell: bash
        run: |
          set -eux
          V="${{ github.ref_name }}"; N="${{ matrix.name }}"
          D="target/${{ matrix.target }}/release"
          rm -rf dist && mkdir -p dist
          cp "$D/mkbd" "$D/mkb" "$D/mkb-mcp" "$D/mkb-web" dist/
          for lib in "$D"/libonnxruntime*.so*; do
            [ -e "$lib" ] && cp "$lib" dist/ || true
          done
          A="mkb-$V-$N-headless.tar.gz"
          tar -C dist -czf "$A" .
          ( sha256sum "$A" 2>/dev/null || shasum -a 256 "$A" ) > "$A.sha256"

      - name: Assemble complete archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $V = "${{ github.ref_name }}"; $N = "${{ matrix.name }}"
          $D = "target/${{ matrix.target }}/release"
          $APPREL = "app/mkb-tauri/src-tauri/target/${{ matrix.target }}/release"
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist/bin | Out-Null
          Copy-Item "$APPREL/mkb-tauri.exe" dist/
          Copy-Item "$D/mkbd.exe","$D/mkb.exe","$D/mkb-mcp.exe","$D/mkb-web.exe" dist/
          Get-ChildItem "$D" -Filter "onnxruntime*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination dist/
          Copy-Item "$D/mkbd.exe","$D/mkb-mcp.exe","$D/mkb-web.exe" dist/bin/
          Copy-Item "$D/mkb.exe" dist/bin/mkb.exe
          $A = "mkb-$V-$N.zip"
          Compress-Archive -Path dist/* -DestinationPath $A -Force
          (Get-FileHash $A -Algorithm SHA256).Hash.ToLower() + "  " + $A | Out-File -Encoding ascii "$A.sha256"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mkb-${{ github.ref_name }}-${{ matrix.name }}.tar.gz
            mkb-${{ github.ref_name }}-${{ matrix.name }}.tar.gz.sha256
            mkb-${{ github.ref_name }}-${{ matrix.name }}-headless.tar.gz
            mkb-${{ github.ref_name }}-${{ matrix.name }}-headless.tar.gz.sha256
            mkb-${{ github.ref_name }}-${{ matrix.name }}.zip
            mkb-${{ github.ref_name }}-${{ matrix.name }}.zip.sha256
            mkb-${{ github.ref_name }}-${{ matrix.name }}-setup.exe
            mkb-${{ github.ref_name }}-${{ matrix.name }}-setup.exe.sha256
            mkb-${{ github.ref_name }}-${{ matrix.name }}.dmg
            mkb-${{ github.ref_name }}-${{ matrix.name }}.dmg.sha256
            mkb-${{ github.ref_name }}-${{ matrix.name }}.AppImage
            mkb-${{ github.ref_name }}-${{ matrix.name }}.AppImage.sha256
            mkb-${{ github.ref_name }}-${{ matrix.name }}.deb
            mkb-${{ github.ref_name }}-${{ matrix.name }}.deb.sha256
          fail_on_unmatched_files: false
