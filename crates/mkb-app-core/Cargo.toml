[package]
name = "mkb-app-core"
description = "Transport-neutral operations shared by mkb's UI front-ends (desktop, web): the logic behind each UI command, over the daemon client, with no presentation-shell or platform dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mkb-core = { workspace = true, features = ["serde"] }
mkb-protocol.workspace = true
mkb-view.workspace = true
serde = { workspace = true, features = ["derive"] }
